[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iie"
version = "0.2.0"
description = "Investment Intelligence Engine — Sprint 1: auditable point-in-time public-market data foundation"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "pandas>=2.0", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
iie = "iie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iie = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live public endpoints (set IIE_NETWORK_TESTS=1)"]
filterwarnings = ["ignore::Warning:urllib3"]
